source=~/.config/hypr/moccha.conf

# Set programs that you use
$terminal = kitty
$fileManager = kitty -e env EDITOR=nvim yazi

$menu = rofi -show drun
$runMenu = rofi -show run
$clipboard = ~/.local/bin/clipboard
$calc =  rofi -show calc -modi calc -no-show-match -no-sort
$windowMenu = rofi -show window
$browser = vivaldi



# Some default env vars.
env = HYPRCURSOR_THEME, Catppucin-Mocha-Dark
env = HYPRCURSOR_THEME, 16
env = XCURSOR_THEME, catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,16
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = QT_QPA_PLATFORM=wayland
env = MOZ_ENABLE_WAYLAND=1
env = ALACRITTY_SOCKET=wayland
env = HYPRSHOT_DIR, $HOME/Pictures/Screenshots
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
 kb_layout = us,ara
  kb_options = grp:win_space_toggle
    follow_mouse = 2

    touchpad {
        natural_scroll = yes
        disable_while_typing = true 
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 0
    col.active_border = $sapphire 
    col.inactive_border = $text

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    active_opacity = 1.0          # Fully opaque when focused
    inactive_opacity = 0.85     # 70% opacity when unfocused
    rounding = 10

    blur {
        enabled = false
        size = 7
        passes = 3
    }

    shadow {
        enabled = no
        range = 4
        render_power = 3
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
  new_status = master
}



misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

cursor {
    inactive_timeout = 3
}
# Example windowrule v1
# windowrule = float, ^(alacritty)$
# Example windowrule v2
# windowrulev2 = float,class:^(alacritty)$,title:^(alacritty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}
# 1. Banish the blank window (Titled "Cheat Engine") to background workspace 99
windowrule = match:class ^steam_app_3601517378$, match:title ^Cheat Engine$, float true
windowrule = match:class ^steam_app_3601517378$, match:title ^Cheat Engine$, workspace 99
windowrule = match:class ^steam_app_3601517378$, match:title ^Cheat Engine$, no_initial_focus true

# 2. Catch the REAL interactive UI using the actual title string you uncovered
windowrule = match:class ^steam_app_3601517378$, match:title ^This list shows all the found addresses that matched your last scan$, float true
windowrule = match:class ^steam_app_3601517378$, match:title ^This list shows all the found addresses that matched your last scan$, center true
windowrule = match:class ^steam_app_3601517378$, match:title ^This list shows all the found addresses that matched your last scan$, size 1000 700
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive, 
bind = $mainMod SHIFT, Q, forcekillactive,
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod Shift, B, exec, $browser
bind = $mainMod Shift, C, exec, $vscode
bind = $mainMod Shift, O, exec, $notes
bind = $mainMod, V, togglefloating, 
bind = $mainMod, F, fullscreen, 
bind = $mainMod, space, exec,swaykbdd -n 
bind = alt, space, exec, $runMenu

bind = , Print, exec,  hyprshot -z -o ~/Pictures/Screenshots/ -m region -f "$(date +"%Y-%m-%d %H:%M:%S").png" -s 
bind = CTRL, Print, exec, hyprshot -o ~/Pictures/Screenshots/ -m output -m eDP-1 -f "$(date +"%Y-%m-%d %H:%M:%S").png" -s 
bind = $mainMod, PRINT, exec, hyprshot -z -o ~/Pictures/Screenshots/ -m window -f "$(date +"%Y-%m-%d %H:%M:%S").png" -s

bind = CTRL Shift, r, exec, ~/.config/hypr/scripts/start_record.sh
bind = CTRL Shift, p, exec, ~/.config/hypr/scripts/stop_record.sh

# bind = $mainMod, tab, exec, $windowMenu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod ,D, exec, $menu
bind = $mainMod SHIFT, X, exec,$lock # dwindle
bind = CTRL, ESCAPE, exec, kitty -e btop
bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, bringactivetotop,

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + vim keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Resize Windows
bind = $mainMod SHIFT, right, resizeactive, 20 0
bind = $mainMod SHIFT, left, resizeactive, -20 0
bind = $mainMod SHIFT, up, resizeactive, 0 -20
bind = $mainMod SHIFT, down, resizeactive, 0 20

# Volume and Media Control

#bind = , XF86AudioRaiseVolume, exec,pactl set-sink-volume @DEFAULT_SINK@ +1% 
#bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%  
#bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle 
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous



# ScreenShot

#bind = ,Print, exec, 
#now=$(date +"%Y-%m-%d_%H-%M-%S") && grim -s -u ~/Pictures/Screenshots/"$now.png" && xclip -selection clipboard -t image/png < ~/Pictures/Screenshots/"$now.png"

#bind = Control,Print, exec, now=$(date +"%Y-%m-%d %H:%M:%S") && grim > ~/Pictures/Screenshots/"$now.png" && xclip -selection clipboard -t image/png < ~/Pictures/Screenshots/"$now.png"

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mod TAB and Mod Shift Tab cycle through workspaces


# Example special workspace (scratchpad)

bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Tiling mode with SUPER + T
bind = SUPER, T, settiled

# Floating mode with SUPER + S
bind = SUPER, S, setfloating



bind = CTRL+$mainMod+alt, R, exec, reboot


bind = $mainMod, X, exec, $clipboard

bind = $mainMod, C, exec, $calc
# Move window to the LEFT half of the screen
bind = SUPER+Shift, H, movewindow, l

# Move window to the RIGHT half of the screen
bind = SUPER+Shift, L, movewindow, r

# Move window to the TOP half of the screen
bind = SUPER+Shift, K, movewindow, u

# Move window to the BOTTOM half of the screen
bind = SUPER+shift, J, movewindow, d
# Volume controls
bind = ,F1, exec, pamixer -t  # Mute

binde = , F3, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%# Increase volume
binde = , F2, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%   # Decrease volume

binde = , F4, exec, ~/.config/hypr/scripts/mic.sh  # Mic mute

# Brightness (requires brightnessctl)
binde = , F5, exec, brightnessctl set 1%-
binde = , F6, exec, brightnessctl set +1%


binde = , F8, exec, pactl set-source-volume @DEFAULT_SOURCE@ +1%
binde = , F7, exec, pactl set-source-volume @DEFAULT_SOURCE@ -1%
# Keyboard shortcut to restart Waybar (Mod+Shift+R)



# Alternative that waits for clean exit
# Proper atomic restart (tested working)
bind = SUPERALT, R, exec, pkill waybar && hyprctl dispatch exec waybar
input {
    touchdevice {
        enabled = true
        output = "eDP-1"  # Replace with your monitor (check `hyprctl monitors`)
        transform = 0     # Rotate if needed (0, 90, 180, 270)
    }
}


# 3-finger swipe gestures
bind = , swipe:3:left, workspace, e-1
bind = , swipe:3:right, workspace, e+1
bind = , swipe:3:up, exec, notify-send "Swipe Up"
bind = , swipe:3:down, exec, notify-send "Swipe Down"

# Long-press (hold) to right-click (experimental)
bind = , hold:2, exec, notify-send "Hold Detected"

# fan Speed
bind = CTRL+SHIFT+ALT, 0, exec, echo level auto | sudo tee /proc/acpi/ibm/fan && notify-send -i ~/.config/hypr/scripts/icons/fan.png "Fan Speed" "set to auto"
bind = CTRL+SHIFT+ALT, 7, exec, echo level 7 | sudo tee /proc/acpi/ibm/fan && notify-send -i ~/.config/hypr/scripts/icons/fan.png "Fan Speed" "set to 7"
bind = CTRL+SHIFT+ALT, 9, exec, echo level full-speed | sudo tee /proc/acpi/ibm/fan && notify-send -i ~/.config/hypr/scripts/icons/fan.png "Fan Speed" "set to full-speed"

# Wattage 
bind = CTRL+SHIFT+ALT, 1, exec, sh -c "sudo ~/.config/hypr/scripts/watt10.sh && notify-send -i ~/.config/hypr/scripts/icons/power.png 'Wattage' 'Set to 10W'"
bind = CTRL+SHIFT+ALT, 2, exec, sh -c "sudo ~/.config/hypr/scripts/watt15.sh && notify-send -i ~/.config/hypr/scripts/icons/power.png 'Wattage' 'Set to 15W'"
bind = CTRL+SHIFT+ALT, 3, exec, sh -c "sudo ~/.config/hypr/scripts/watt30.sh && notify-send -i ~/.config/hypr/scripts/icons/power.png 'Wattage' 'Set to 30W'"

bind = $mainMod, Z, exec, rofimoji
