exec-once = nm-applet & waybar & awww-daemon & dunst & blueman-applet & gammastep -l 35.4021:0.1400 &  greenclip daemon & exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP 
